services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so the meeting:* registry survives restarts.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [internal]

  agent:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -m src.agent start
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MEETING_PUBLIC_URL: http://localhost:8765
    volumes:
      - ./out:/app/out
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    stop_grace_period: 30s
    develop:
      watch:
        # Source edits sync into the image, then the process is restarted
        # (python -m has no auto-reload). A dep change rebuilds the image.
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore: ["**/__pycache__/"]
        - action: sync+restart
          path: ./scripts
          target: /app/scripts
          ignore: ["**/__pycache__/"]
        - action: rebuild
          path: ./pyproject.toml

  # Participant-facing tier, split like the console: a JSON API (meeting) behind
  # an nginx SPA host (meeting-frontend) that serves the bundle + proxies /api.
  meeting:
    build:
      context: .
      dockerfile: Dockerfile.meeting
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      MEETING_PORT: 8771
      # The join flow mints its voice-join token via dispatch (internal).
      DISPATCH_URL: http://dispatch:8766
    ports:
      - "8771:8771"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8771/healthz').read()"
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [internal, public]
    # Stateless — safe to scale: deploy.replicas: N behind a load balancer.
    develop:
      watch:
        # This image copies only src/__init__.py + src/meeting/.
        - action: sync+restart
          path: ./src/meeting
          target: /app/src/meeting
          ignore: ["**/__pycache__/"]
        - action: sync+restart
          path: ./src/__init__.py
          target: /app/src/__init__.py

  meeting-frontend:
    build:
      context: .
      dockerfile: Dockerfile.meeting-frontend
    restart: unless-stopped
    ports:
      - "8765:80"
    depends_on:
      - meeting
    networks: [public]
    develop:
      watch:
        # Static bundle — no live sync; a rebuild reruns npm build + nginx copy.
        - action: rebuild
          path: ./meeting-frontend
          ignore: ["**/node_modules/", "**/dist/"]
        - action: rebuild
          path: ./shared
          ignore: ["**/node_modules/", "**/dist/"]

  dispatch:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -m src.dispatch_service
    restart: unless-stopped
    env_file: .env
    environment:
      DISPATCH_PORT: 8766
      REDIS_URL: redis://redis:6379/0
      MEETING_PUBLIC_URL: http://localhost:8765
    ports:
      - "8766:8766"
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal, public]
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore: ["**/__pycache__/"]
        - action: sync+restart
          path: ./scripts
          target: /app/scripts
          ignore: ["**/__pycache__/"]
        - action: rebuild
          path: ./pyproject.toml

  template-generator:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -m src.template_generator
    restart: unless-stopped
    env_file: .env
    environment:
      TEMPLATE_GEN_PORT: 8768
      TEMPLATES_DIR: /app/templates_generated
    ports:
      - "8768:8768"
    volumes:
      - ./templates_generated:/app/templates_generated
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8768/healthz').read()"
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [public]
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore: ["**/__pycache__/"]
        - action: rebuild
          path: ./pyproject.toml

  console:
    build:
      context: .
      dockerfile: Dockerfile.console
    command: python -m src.console
    restart: unless-stopped
    env_file: .env
    environment:
      CONSOLE_PORT: 8770
      REDIS_URL: redis://redis:6379/0
      DISPATCH_URL: http://dispatch:8766
      TEMPLATE_GEN_URL: http://template-generator:8768
      MEETING_PUBLIC_URL: http://localhost:8765
      # Local-dev fallback when Cloudflare Access isn't in front. Leave
      # unset in production so requests without Cf-Access-Authenticated-User-Email
      # are rejected with 401.
      CONSOLE_DEV_USER_EMAIL: ${CONSOLE_DEV_USER_EMAIL:-dev@local}
    ports:
      - "8770:8770"
    volumes:
      # Read-only view of the agent's flushed run artifacts — backs the
      # finished-meeting results page + xlsx export.
      - ./out:/app/out:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8770/healthz').read()"
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [internal, public]
    # Stateless — safe to scale: deploy.replicas: N behind a load balancer.
    develop:
      watch:
        # This image copies only src/__init__.py + src/console/ + src/templates/.
        - action: sync+restart
          path: ./src/console
          target: /app/src/console
          ignore: ["**/__pycache__/"]
        - action: sync+restart
          path: ./src/templates
          target: /app/src/templates
          ignore: ["**/__pycache__/"]
        - action: sync+restart
          path: ./src/__init__.py
          target: /app/src/__init__.py

  console-frontend:
    build:
      context: .
      dockerfile: Dockerfile.console-frontend
    restart: unless-stopped
    ports:
      - "8769:80"
    depends_on:
      - console
    networks: [public]
    develop:
      watch:
        # Static bundle — no live sync; a rebuild reruns npm build + nginx copy.
        - action: rebuild
          path: ./console-frontend
          ignore: ["**/node_modules/", "**/dist/"]
        - action: rebuild
          path: ./shared
          ignore: ["**/node_modules/", "**/dist/"]

networks:
  internal: {}
  public: {}

volumes:
  redis-data: {}
