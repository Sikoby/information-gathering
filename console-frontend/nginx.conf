# Console SPA: serve the static bundle, reverse-proxy /api + /healthz to the
# console backend. Same-origin, so the browser needs no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match the console's aiohttp ceiling so PPTX uploads aren't truncated.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://console:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Template generation can hold a request open for minutes.
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    location = /healthz {
        proxy_pass http://console:8770/healthz;
    }

    # SPA fallback — deep links like /meetings/<id> must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
